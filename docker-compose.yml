services:
  mongo:
    image: mongo:6
    container_name: mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - scooter-network 
      
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - mongo
    restart: unless-stopped
    command: > 
      sh -c "node server.js"
    networks:
      - scooter-network

  admin-webb:
    build: ./admin-webb
    ports:
      - "8081:80"
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      BASE_API_URL: http://backend:3000
    restart: unless-stopped
    networks:
      - scooter-network

  user-webb:
    build: ./user-webb
    ports:
      - "8080:80"
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      BASE_API_URL: http://backend:3000
    restart: unless-stopped

  user-mobile:
    build: ./user-mobile
    ports:
      - "8082:80"
    depends_on:
      - backend
    env_file:
      - ./.env
    environment:
      BASE_API_URL: http://backend:3000
    restart: unless-stopped

  bike:
    build: ./bike
    depends_on:
      - backend
    environment:
      BASE_API_URL: http://backend:3000
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - scooter-network

  simulation:
    build: ./simulation
    environment:
      BASE_API_URL: http://backend:3000
    depends_on:
      - backend
    env_file:
      - ./.env
    restart: unless-stopped
    networks:
      - scooter-network

networks:
  scooter-network:
    driver: bridge

volumes:
  mongo-data:
